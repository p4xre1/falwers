<body data-page="admin-settings" data-admin-page="faq">
<noscript><p style="background:#A03A3A;color:#fff;padding:14px 18px;text-align:center">This page requires JavaScript. / تتطلب هذه الصفحة تفعيل JavaScript.</p></noscript>

<header class="ad-head" id="adHead"></header>
<div class="ad-body">
  <nav class="ad-side" id="adSide" aria-label="Admin sections"></nav>
  <main class="ad-main">
    <div class="set-card">
      <h4 data-i18n="faqadm_t">FAQ</h4>
      <p class="set-sub" data-i18n="faqadm_sub"></p>
      <div id="faqAdmList" style="display:flex;flex-direction:column;gap:14px"></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">
        <button class="btn btn-sm" id="faqAdd" type="button" data-i18n="faqadm_add"></button>
        <button class="btn btn-wine btn-sm" id="faqSave" type="button" data-i18n="faqadm_save"></button>
      </div>
    </div>
    <div class="set-card">
      <h4 data-i18n="ab_bulk">استيراد جماعي</h4>
      <div class="fld"><textarea id="faqBulk" rows="6" style="width:100%;border:1px solid var(--line-2);border-radius:12px;padding:12px;font:inherit;background:var(--soft)"></textarea><p class="set-sub" data-i18n="faqadm_hint"></p></div>
      <button class="btn btn-wine btn-sm" id="faqBulkGo" type="button" data-i18n="ab_bulk_go"></button>
    </div>
  </main></main>
</div>


<!-- PASSCODE GATE -->
<div class="mbk" id="pcModal" role="dialog" aria-modal="true" aria-labelledby="pcTitle">
  <div class="mcard sm">
    <div class="pc-center">
      <div class="gate-brand">
        <div class="gb-name">Rose by Marry</div>
        <div class="gb-sub">Admin CMS</div>
      </div>
      <div class="pc-ico" aria-hidden="true">R</div>
      <h3 id="pcTitle" data-i18n="pc_t">دخول الإدارة</h3>
      <p class="step-d" data-i18n="pc_d">أدخل رمز المرور للوصول إلى لوحة التحكم.</p>
      <div class="fld" style="text-align:start">
        <input id="pcUser" type="text" maxlength="30" autocomplete="off" autocapitalize="off" spellcheck="false" data-i18n-ph="pc_user" placeholder="marry">
      </div>
      <div class="fld" style="text-align:start">
        <input id="pcInput" type="password" maxlength="64" autocomplete="off" data-i18n-ph="pc_ph" placeholder="••••">
      </div>
      <input id="pc_web" type="text" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;height:0;width:0;opacity:0">
      <input id="pc_ts" type="hidden" value="">
      <button class="btn btn-primary" id="pcGo" type="button" style="width:100%" data-i18n="pc_go">دخول</button>
      <span class="pc-err" id="pcErr"></span>
    </div>
  </div>
</div>
<!-- CONFIRM -->
<div class="mbk" id="cfModal" role="dialog" aria-modal="true">
  <div class="mcard sm">
    <h3 style="color:var(--wine);font-size:1.1rem;letter-spacing:.14em;text-transform:uppercase" id="cfTitle" data-i18n="cf_title"></h3>
    <p style="color:var(--muted);font-size:.88rem;margin:10px 0 20px" id="cfMsg"></p>
    <div style="display:flex;gap:10px">
      <button class="btn btn-danger" id="cfOk" type="button" style="flex:1" data-i18n="cf_ok">تأكيد</button>
      <button class="btn btn-outline" id="cfCancel" type="button" style="flex:1" data-i18n="cf_cancel">إلغاء</button>
    </div>
  </div>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="../assets/js/ui.js?v=83"></script>

<script src="assets/errbar.js?v=83"></script>
</body>
</html>
